name = "moltbooky-resolver"
main = "src/worker/index.ts"
compatibility_date = "2024-12-05"

[triggers]
crons = ["0 * * * *"]

[[queues.producers]]
binding = "RESOLUTION_QUEUE"
queue = "moltbooky-resolution"

[[queues.consumers]]
queue = "moltbooky-resolution"
max_batch_size = 10
max_batch_timeout = 30
