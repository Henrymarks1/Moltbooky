name = "moltbooky"
main = "src/worker/index.ts"
compatibility_date = "2024-12-05"

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "moltbooky"
database_id = "local-dev-placeholder"

[[queues.producers]]
binding = "RESOLUTION_QUEUE"
queue = "moltbooky-resolution"

[[queues.consumers]]
queue = "moltbooky-resolution"
max_batch_size = 10
max_batch_timeout = 30

[[durable_objects.bindings]]
name = "CHALLENGE_OBJECT"
class_name = "ChallengeObject"

[[migrations]]
tag = "v1"
new_classes = ["ChallengeObject"]
