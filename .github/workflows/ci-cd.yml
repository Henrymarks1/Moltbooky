name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  VITE_PRIVY_APP_ID: cmpnoa34y00ma0cl8qwgrv81t

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workspace
        run: pnpm run lint

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Build workspace
        run: pnpm --recursive --if-present run build

  deploy:
    name: Migrate and deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm --recursive --if-present run build

      - name: Run database migrations
        run: pnpm --filter @moltbooky/db run migrate

      - name: Deploy API worker
        run: pnpm exec wrangler deploy --config apps/api/wrangler.toml

      - name: Deploy payments worker
        run: pnpm exec wrangler deploy --config apps/payments/wrangler.toml

      - name: Deploy resolver worker
        run: pnpm exec wrangler deploy --config apps/resolver/wrangler.toml

      - name: Deploy web to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name=moltbooky --branch production --cwd apps/web
